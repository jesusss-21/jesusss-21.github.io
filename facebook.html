
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Título Centrado</title>
    <style>
        .titulo {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 25%; /* Ajusta el tamaño de la imagen si es necesario */
            text-align: center; /* Alinea el texto dentro del elemento (opcional) */
        }
    </style>
</head>
<body>
    <img src="img/HILO-URBANO-12-2-2025.png" alt="Título" class="titulo">
    <h1>Contenido de la Página</h1>
    <p>Este es un ejemplo de cómo centrar una imagen y usarla como título en HTML.</p>
</body>
</html>
